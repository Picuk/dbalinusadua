<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dbalinusadua</title>
    <style>
      /* [Sama seperti CSS Anda sebelumnya, tidak diubah] */
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 20px;
        background-color: #f0f4f8;
        color: #333;
        font-size: 28px;
      }
      /* ... lanjutan style ... (semua tetap sama) */
    </style>
  </head>
  <body>
    <h1>Dbalinusadua</h1>

    <div class="controls">
      <input type="text" id="searchInput" onkeyup="filterGuests()" placeholder="Cari nama tamu..." />
      <button onclick="window.print()">🖨️ Cetak PDF</button>
    </div>

    <div id="dataContainer"></div>

    <script>
      let currentGuest = "";

      function filterGuests() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const groups = document.querySelectorAll(".group-container");
        groups.forEach(group => {
          const guestElem = group.querySelector(".guest-name");
          const guestName = guestElem?.textContent.toLowerCase() || "";
          group.style.display = guestName.includes(input) ? "block" : "none";
        });
      }

      fetch("data.json")
        .then(response => response.json())
        .then(data => {
          let html = "";

          data.forEach((row, index) => {
            const {
              guestName, carNumber, agent, date,
              adult, child, infant, activity, countOfCar, color = "#facc15"
            } = row;

            const isNewGroup = guestName !== currentGuest;
            if (isNewGroup && currentGuest !== "") {
              html += `</div></div><div class="group-separator"></div>`;
            }

            if (isNewGroup) {
              html += `
              <div class="group-container">
                <div class="group-header">
                  <div><span class="label">Car Number</span><span class="value">${carNumber}</span></div>
                  <div><span class="label">Guest Name</span><span class="value guest-name">${guestName}</span></div>
                  <div><span class="label">Agent</span><span class="agent-box" style="background-color:${color}">${agent}</span></div>
                  <div><span class="label">Date</span><span class="value">${date} WITA</span></div>
                </div>
                <div class="details">
              `;
              currentGuest = guestName;
            }

            html += `<div class="detail-box">`;

            if (adult) html += `<div class="pax-box">🧑 ${adult} ADULT</div>`;
            if (child) html += `<div class="pax-box">🧒 ${child} CHILD</div>`;
            if (infant) html += `<div class="pax-box">👶 ${infant} INFANT</div>`;

            if (countOfCar) html += `<div class="car-box">🚗 ${countOfCar} Car</div>`;
            if (activity) html += `<div class="label">Activity</div><div class="value">${activity}</div>`;

            // Add any remaining dynamic fields if necessary

            html += `</div>`;
          });

          if (currentGuest !== "") {
            html += `</div></div>`;
          }

          document.getElementById("dataContainer").innerHTML = html;
        });
    </script>
  </body>
</html>
