<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Agent</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; background-color: #f9fafb; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 0.75rem; text-align: left; }
    th { background-color: #e5e7eb; }
  </style>
</head>
<body>
  <h1>Data Agent</h1>
  <div id="table-container">Loading...</div>

  <script>
    function loadData(data) {
      const { headers, rows } = data;
      const container = document.getElementById("table-container");
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");

      const headerRow = document.createElement("tr");
      headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      rows.forEach(({ row, color }) => {
        const tr = document.createElement("tr");
        tr.style.backgroundColor = color;
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      container.innerHTML = "";
      container.appendChild(table);
    }

    const script = document.createElement("script");
    script.src = "https://script.google.com/macros/s/AKfycbxg3sZklL-Qh6ONHurCCkzkXXCXllhd6xt4VCpIkLmTFWLxoLQJfYvoVIzsUWedHplN/exec?callback=loadData";
    document.body.appendChild(script);
  </script>
</body>
</html>
